<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị bản quyền · Mr. Huỳnh</title>
<style>
:root{--bg:#070b24;--sf:#0e1438;--sf2:#151d4a;--bd:#26306a;--tx:#eef1ff;--mu:#9aa3d6;--ac:#ff8a1f;--ok:#2fd27a;--bad:#ff5a6a;--warn:#ffc94a;--vid:#22d3ee;--voi:#c084fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:linear-gradient(90deg,#0b1240,#131c55);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:17px;margin:0}header .sp{flex:1}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 11px}
button{cursor:pointer;background:linear-gradient(135deg,var(--ac),#ff6a00);border:none;font-weight:600}
button.g{background:var(--sf2);border:1px solid var(--bd);font-weight:500}button.r{background:#4a1520;border:1px solid #7a2333}
button:hover{filter:brightness(1.12)}
.prod{display:flex;gap:6px}.prod button{background:var(--sf2);border:1px solid var(--bd);font-weight:700}
.prod button.on.video{background:#0e4f63;border-color:var(--vid)}.prod button.on.voice{background:#43206a;border-color:var(--voi)}.prod button.on.gcloud{background:#0b4d3a;border-color:#10b981}
nav{display:flex;gap:6px;padding:12px 22px 0;flex-wrap:wrap}nav a{padding:9px 15px;border-radius:8px 8px 0 0;color:var(--mu);cursor:pointer;text-decoration:none}
nav a.on{background:var(--sf);color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
main{background:var(--sf);margin:0 22px 22px;border-radius:0 10px 10px 10px;padding:20px;min-height:60vh;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:16px}.card b{display:block;font-size:24px;margin-top:4px}.card span{color:var(--mu);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500;position:sticky;top:0;background:var(--sf)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}.t-active,.t-paid{background:#123d2a;color:var(--ok)}.t-new,.t-pending{background:#1d2a66;color:#9fb4ff}.t-revoked{background:#4a1520;color:var(--bad)}.t-merged,.t-expired{background:#333;color:#bbb}.t-exp,.t-review{background:#4a3a10;color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12.5px}
.mono{font-family:Consolas,monospace}.mu{color:var(--mu)}.k{font-family:Consolas,monospace;font-weight:600;letter-spacing:.5px;word-break:break-all}
#login{max-width:380px;margin:12vh auto;background:var(--sf);padding:28px;border-radius:12px;border:1px solid var(--bd)}#login input{width:100%;margin:12px 0}
pre.made{background:#050819;padding:14px;border-radius:8px;border:1px solid var(--bd);white-space:pre-wrap}
.box{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:18px}.box h3{margin:0 0 10px;font-size:15px}
.acts button{padding:4px 9px;font-size:12px;margin:1px}
#toast{position:fixed;right:20px;bottom:20px;background:var(--sf2);border:1px solid var(--bd);padding:12px 16px;border-radius:8px;display:none;max-width:420px}
</style></head><body>
<div id="login"><h2 style="margin:0 0 4px">Quản trị bản quyền</h2><div class="mu">Video AI &amp; Voice AI · Mr. Huỳnh</div>
<input id="tok" type="password" placeholder="Mật khẩu quản trị" onkeydown="if(event.key=='Enter')login()"><button onclick="login()" style="width:100%">Đăng nhập</button><div id="lerr" style="color:var(--bad);margin-top:10px"></div></div>
<div id="app" style="display:none">
<header><h1>🔑 Bản quyền · Mr. Huỳnh</h1>
<div class="prod"><button id="pv" class="video" onclick="setProd('video')">🎬 Video AI</button><button id="po" class="voice" onclick="setProd('voice')">🎙 Voice AI</button><button id="pg" class="gcloud" onclick="setProd('gcloud')">☁ GCloud Hub</button></div>
<span class="sp"></span><button class="g" onclick="logout()">Đăng xuất</button></header>
<nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>
<script>
let T='';try{T=sessionStorage.getItem('adm')||''}catch(e){}
let PROD='video';try{PROD=localStorage.getItem('prod')||'video'}catch(e){}
const $=s=>document.querySelector(s);const fmt=n=>(n||0).toLocaleString('vi-VN')+'đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=t=>t?new Date(t*1000).toLocaleString('vi-VN'):'';const d=t=>t?new Date(t*1000).toLocaleDateString('vi-VN'):'';
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
async function api(a,body,qs=''){const r=await fetch('api.php?a='+a+qs,{method:body?'POST':'GET',headers:{'x-admin-token':T,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
 let j;try{j=await r.json()}catch(e){j={ok:false,message:'Máy chủ trả về lỗi '+r.status}}
 if(r.status==401){logout();throw j}if(!j.ok)toast(j.message||'Lỗi');return j}
async function login(){T=$('#tok').value.trim();try{const j=await api('info');if(!j.ok)throw j;try{sessionStorage.setItem('adm',T)}catch(e){};show(j)}catch(e){$('#lerr').textContent=(e&&e.message)||'Sai mật khẩu'}}
function logout(){T='';try{sessionStorage.removeItem('adm')}catch(e){};$('#app').style.display='none';$('#login').style.display='block'}
let INFO={};
function show(j){INFO=j;$('#login').style.display='none';$('#app').style.display='block';$('#po').style.display=j.voice?'':'none';$('#pg').style.display=j.gcloud?'':'none';if(PROD=='voice'&&!j.voice)PROD='video';if(PROD=='gcloud'&&!j.gcloud)PROD='video';setProd(PROD)}
const TABS={video:[['stats','Tổng quan'],['installs','Máy đã cài'],['keys','Danh sách key'],['create','Tạo key'],['plans','Bảng giá'],['guides','Video hướng dẫn'],['release','Cập nhật phần mềm'],['orders','Đơn hàng'],['events','Nhật ký']],
 voice:[['v_stats','Tổng quan'],['v_installs','Máy đã cài'],['v_plans_edit','Bảng giá'],['v_capkey','Cấp key thủ công'],['v_orders','Đơn hàng'],['v_transactions','Giao dịch SePay'],['v_version','Thông báo bản mới']],
 gcloud:[['g_stats','Tổng quan'],['g_releases','Phát hành & cập nhật'],['g_events','Nhật ký']]};
const GUIDE_PAGES=[['flow_image','Tạo ảnh Flow'],['flow_video','Tạo Video Flow'],['gpt_image','Tạo ảnh GPT'],['grok_image','Tạo ảnh Grok'],['muse_image','Tạo ảnh Muse'],['dreamina','Tạo Video Dreamina'],['meta_muse','Tạo Video Muse'],['meta_vibes','Tạo Video Meta Vibes'],['grok_video','Tạo Video Grok'],['refs','Kho ảnh tham chiếu'],['workflow','Workflow'],['upscale','Nâng Cấp Ảnh'],['video_tools','Công Cụ Video'],['logs','Log Chi Tiết']];
let cur='stats',PLANS=[];
function setProd(p){PROD=p;try{localStorage.setItem('prod',p)}catch(e){};$('#pv').classList.toggle('on',p=='video');$('#po').classList.toggle('on',p=='voice');$('#pg').classList.toggle('on',p=='gcloud');go(TABS[p][0][0])}
async function go(t){cur=t;$('#nav').innerHTML=TABS[PROD].map(([k,n])=>`<a class="${k==t?'on':''}" onclick="go('${k}')">${n}</a>`).join('');
 const m=$('#main');m.innerHTML='<span class="mu">Đang tải…</span>';PLANS=PROD=='gcloud'?[]:((await api(PROD=='video'?'plans':'v_plans')).plans||[]);await R[t](m)}
const planName=c=>(PLANS.find(p=>p.code==c)||{}).name||c;
function kstatus(k,now){if(k.status=='active'&&k.expires_at&&k.expires_at<now)return'<span class="tag t-exp">hết hạn</span>';
 return`<span class="tag t-${k.status}">${{new:'chưa dùng',active:'đang dùng',revoked:'đã khóa',merged:'đã gia hạn'}[k.status]}</span>`}
function ostatus(o,now){let s=o.status;if(s=='pending'&&o.expires_at<now)s='expired';return`<span class="tag t-${s}">${{pending:'chờ chuyển khoản',paid:'đã thanh toán',review:'thiếu tiền / cần xem',expired:'hết hạn'}[s]||s}</span>`}
const R={
 // ---------------- VIDEO AI
 async stats(m){const[s,ins]=await Promise.all([api('stats'),api('installs').catch(()=>null)]);m.innerHTML=(ins&&ins.ok?R.instCards(ins.stats):'')+`<div class="cards">
 <div class="card"><span>Key đang hoạt động</span><b>${s.active}</b></div><div class="card"><span>Key chưa kích hoạt</span><b>${s.unused}</b></div>
 <div class="card"><span>Đơn chờ chuyển khoản</span><b>${s.pending}</b></div><div class="card"><span>Đơn thiếu tiền / cần xem</span><b style="color:${s.review?'var(--warn)':''}">${s.review}</b></div>
 <div class="card"><span>Doanh thu hôm nay</span><b>${fmt(s.revenue_today)}</b></div><div class="card"><span>Doanh thu 30 ngày</span><b>${fmt(s.revenue_30d)}</b></div>
 <div class="card"><span>Tổng doanh thu</span><b>${fmt(s.revenue_all)}</b></div></div>
 <p class="mu" style="margin-top:18px">Thanh toán tự động (VietQR + SePay, dùng chung tài khoản với Voice AI): <b style="color:${s.payment?'var(--ok)':'var(--warn)'}">${s.payment?'đang bật':'chưa bật'}</b></p>
 <p class="mu">Khóa công khai Video AI (dán vào videoai/license_config.json): <span class="mono">${esc(INFO.video_pubkey||'')}</span></p>`},
 // máy đã cài / đang hoạt động (phần mềm báo khi kiểm tra cập nhật và mỗi 30 phút khi đang mở)
 instCards(s){const rel=[s.release_win&&'Win v'+s.release_win,s.release_mac&&'Mac v'+s.release_mac].filter(Boolean).join(' · ')||'—';
  return`<div class="cards" style="margin-bottom:14px">
 <div class="card"><span>Máy đang mở (30 phút)</span><b style="color:var(--ok)">${s.online}</b></div>
 <div class="card"><span>Máy hoạt động (24 giờ)</span><b>${s.active_24h}</b></div>
 <div class="card"><span>Máy dùng (30 ngày)</span><b>${s.used_30d}</b></div>
 <div class="card"><span>Tổng máy đã cài</span><b>${s.total}</b></div>
 <div class="card"><span>Lượt kiểm tra cập nhật</span><b>${(s.checks||0).toLocaleString('vi-VN')}</b></div>
 <div class="card"><span>Bản đang phát hành</span><b style="font-size:18px">${esc(rel)}</b></div></div>`},
 async installs(m){const j=await api('installs');const s=j.stats,now=Date.now()/1000;
  const ago=t=>{const x=now-t;return x<120?'vừa xong':x<3600?Math.floor(x/60)+' phút trước':x<86400?Math.floor(x/3600)+' giờ trước':Math.floor(x/86400)+' ngày trước'};
  m.innerHTML=R.instCards(s)+`<div class="cards" style="margin-bottom:14px">
 <div class="card"><span>Máy mới (7 ngày)</span><b>${s.new_7d}</b></div>
 <div class="card"><span>PRO / Miễn phí (30 ngày)</span><b>${s.pro_30d} / ${s.free_30d}</b></div>
 <div class="card"><span>Windows / macOS (30 ngày)</span><b>${s.win_30d} / ${s.mac_30d}</b></div>
 <div class="card"><span>Phiên bản đang dùng (30 ngày)</span><b style="font-size:13px;line-height:1.5">${(s.versions||[]).map(v=>`${v.os=='mac'?'Mac':'Win'} ${esc(v.version||'?')}: ${v.n}`).join('<br>')||'—'}</b></div></div>
 <p class="mu">Chỉ đếm máy dùng phần mềm từ bản 2.1.4 trở lên (bản cũ chưa gửi mã máy). Máy đang mở = phần mềm báo về trong 35 phút gần nhất.</p>
 <table><tr><th>Mã máy</th><th>Hệ điều hành</th><th>Phiên bản</th><th>Gói</th><th>Key</th><th>Cài lúc</th><th>Hoạt động gần nhất</th></tr>`+
  j.list.map(x=>`<tr><td class="mono" title="${esc(x.machine)}">${esc(x.machine.slice(0,12))}…</td><td>${x.os=='mac'?'macOS':'Windows'}</td><td>${esc(x.version||'')}</td>
  <td>${x.tier=='pro'?'<span class="tag t-active">PRO</span>':'<span class="tag t-new">Miễn phí</span>'}</td><td class="k">${esc(x.key||'')}</td>
  <td>${dt(+x.first_at)}</td><td>${now-x.last_at<2100?'<b style="color:var(--ok)">● đang mở</b>':ago(+x.last_at)}</td></tr>`).join('')+'</table>'},
 async keys(m){m.innerHTML=`<div class="row"><input id="q" placeholder="Tìm key, tên khách, SĐT, mã máy…" style="flex:1" onkeydown="if(event.key=='Enter')R.keysLoad()"><button class="g" onclick="R.keysLoad()">Tìm</button></div><div id="kt"></div>`;R.keysLoad()},
 async keysLoad(){const j=await api('keys',null,'&q='+encodeURIComponent($('#q').value||''));
  $('#kt').innerHTML=`<table><tr><th>Key</th><th>Gói</th><th>Trạng thái</th><th>Hết hạn</th><th>Khách</th><th>Máy</th><th>Tạo</th><th></th></tr>`+
  j.keys.map(k=>`<tr><td class="k">${esc(k.key)}</td><td>${esc(planName(k.plan))}${k.status=='new'?` <span class="mu">(${k.days} ngày)</span>`:''}<div class="mu">${fmt(+k.price)}</div></td>
  <td>${kstatus(k,j.now)}${k.merged_into?`<div class="mu mono">→ ${esc(k.merged_into)}</div>`:''}</td><td>${k.status=='new'?'':(+k.expires_at===0?'<b>Vĩnh viễn</b>':d(+k.expires_at))}</td>
  <td>${esc(k.customer||'')}<div class="mu">${esc(k.note||'')}</div></td><td class="mono mu" title="${esc(k.machine||'')}">${esc((k.machine||'').slice(0,10))}${+k.transfers?` ⇄${k.transfers}`:''}</td><td class="mu">${d(+k.created_at)}</td>
  <td class="acts"><button class="g" onclick="act('extend','${k.key}')">+ ngày</button><button class="g" onclick="act('note','${k.key}')">Ghi chú</button>
  <button class="g" onclick="act('reset_machine','${k.key}')">Đổi máy</button>${k.status=='revoked'?`<button class="g" onclick="act('unrevoke','${k.key}')">Mở khóa</button>`:`<button class="r" onclick="act('revoke','${k.key}')">Khóa</button>`}
  <button class="g" onclick="copy('${k.key}')">Chép</button></td></tr>`).join('')+'</table>'},
 async create(m){m.innerHTML=`<div class="row"><label>Gói<select id="cp">${PLANS.map(p=>`<option value="${p.code}">${esc(p.name)} — ${fmt(+p.price)}</option>`).join('')}</select></label>
  <label>Số lượng<input id="cn" type="number" value="1" min="1" max="200" style="width:90px"></label>
  <label>Số ngày (trống = theo gói)<input id="cd" type="number" style="width:150px"></label><label>Giá bán (trống = theo gói)<input id="cpr" type="number" style="width:160px"></label></div>
  <div class="row"><label style="flex:1">Tên khách / SĐT / Zalo<input id="cc"></label><label style="flex:1">Ghi chú<input id="cno"></label><button onclick="R.make()">Tạo key Video AI</button></div><pre id="made" class="made k" style="display:none"></pre>`},
 async make(){const j=await api('create',{plan:$('#cp').value,count:$('#cn').value,days:$('#cd').value,price:$('#cpr').value,customer:$('#cc').value,note:$('#cno').value});
  if(j.ok){const e=$('#made');e.style.display='block';e.textContent=j.keys.join('\n');copy(j.keys.join('\n'));toast('Đã tạo '+j.keys.length+' key (đã chép)')}},
 async plans(m){m.innerHTML=`<p class="mu">Sửa giá ở đây, phần mềm của khách tự cập nhật bảng giá. Số ngày 0 = vĩnh viễn.</p><table><tr><th>Mã</th><th>Tên gói</th><th>Số ngày</th><th>Giá (VNĐ)</th><th>Nhãn</th><th>Hiện</th></tr>`+
  PLANS.map((p,i)=>`<tr><td class="mono">${p.code}</td><td><input id="pn${i}" value="${esc(p.name)}"></td><td><input id="pd${i}" type="number" value="${p.days}" style="width:90px"></td><td><input id="pp${i}" type="number" value="${p.price}" style="width:130px"></td><td><input id="pb${i}" value="${esc(p.badge||'')}"></td><td><input id="pa${i}" type="checkbox" ${+p.active?'checked':''}></td></tr>`).join('')+
  `</table><p><button onclick="R.savePlans()">Lưu bảng giá</button></p>`},
 async savePlans(){await api('plans',{plans:PLANS.map((p,i)=>({code:p.code,name:$('#pn'+i).value,days:$('#pd'+i).value,price:$('#pp'+i).value,badge:$('#pb'+i).value,active:$('#pa'+i).checked}))});toast('Đã lưu');go('plans')},
 async guides(m){const j=await api('guides');const g={};(j.guides||[]).forEach(x=>g[x.page]=x.url);
  m.innerHTML=`<p class="mu">Dán link YouTube cho từng chức năng. Phần mềm hiện nút “Xem Video hướng dẫn” ở trang đó (để trống = ẩn nút).</p><table><tr><th style="width:230px">Chức năng</th><th>Link (https://…)</th><th style="width:70px"></th></tr>`+
  GUIDE_PAGES.map(([k,n])=>`<tr><td><b>${n}</b><div class="mu mono">${k}</div></td><td><input id="g_${k}" value="${esc(g[k]||'')}" placeholder="https://www.youtube.com/watch?v=…" style="width:100%"></td><td><button class="g" onclick="const v=$('#g_${k}').value.trim();if(v)window.open(v,'_blank')">Mở</button></td></tr>`).join('')+
  `</table><p><button onclick="R.saveGuides()">Lưu link hướng dẫn</button></p>`},
 async saveGuides(){const g={};GUIDE_PAGES.forEach(([k])=>g[k]=$('#g_'+k).value.trim());const j=await api('guides',{guides:g});if(j.ok){toast('Đã lưu');go('guides')}},
 async release(m){const j=await api('releases');const L=j.releases.find(r=>+r.id==j.latest_id);const LM=j.releases.find(r=>+r.id==j.latest_mac_id);
  const mb=n=>n?(n/1048576).toFixed(1)+' MB':'';
  m.innerHTML=`<div class="box"><h3>Bản đang phát hành cho khách</h3>${L?`<b style="font-size:20px">v${esc(L.version)}</b> <span class="mu">· ${dt(+L.created_at)} · ${mb(+L.size)}</span>${+L.mandatory?' <span class="tag t-exp">bắt buộc</span>':''}${L.min_version?` <span class="tag t-exp">bắt buộc với bản &lt; ${esc(L.min_version)}</span>`:''}<div class="mu mono" style="margin-top:6px;word-break:break-all">${esc(L.url)}</div>`:'<span class="mu">Chưa phát hành bản nào – phần mềm của khách sẽ không thấy bản mới.</span>'}
  <div style="margin-top:12px"><b>macOS:</b> ${LM?`<b>v${esc(LM.version)}</b> <span class="mu">· ${dt(+LM.created_at)} · ${mb(+LM.size)}</span>${+LM.mandatory?' <span class="tag t-exp">bắt buộc</span>':''}`:'<span class="mu">chưa phát hành</span>'}</div></div>
  <div class="box"><h3>Phát hành bản mới</h3>
  <p class="mu" style="margin-top:0">B1. Build trên máy (build Windows.bat) → được <span class="mono">dist\\downloads-upload.zip</span>.<br>
  B2. cPanel › File Manager › <span class="mono">public_html/downloads/</span> › Upload zip đó › Extract (ghi đè) → file duy nhất
  <span class="mono">video_ai_mrhuynh_win.exe</span> dùng cho cả khách tải mới lẫn tự cập nhật.<br>
  B3. Bấm “Tải lại danh sách”, chọn “File trên trang tải”, ghi chú những gì mới, bấm Phát hành <b>ngay sau khi tải lên</b>.<br>
  macOS: build trên máy Mac (build Mac.command) → <span class="mono">dist/downloads-mac-upload.zip</span> › Upload + Extract vào cùng thư mục
  › chọn “File trên trang tải · macOS” › Phát hành.</p>
  <div class="mu" style="margin:-4px 0 10px">Trang tải: <span class="mono">${esc(j.site.url)}</span> ·
  ${j.site.local?`đang có ${j.site.version?'<b>bản '+esc(j.site.version)+'</b> · ':''}${mb(j.site.size)} · tải lên ${dt(j.site.mtime)}`:'máy chủ sẽ tải file qua https để kiểm tra khi bấm Phát hành'}<br>

  <div class="row"><label>Số phiên bản<input id="grv" placeholder="1.0.3" style="width:120px"></label>
  <label>Bắt buộc với bản thấp hơn (tùy chọn)<input id="grmin" placeholder="vd. 1.0.0" style="width:170px"></label>
  <label style="flex-direction:row;align-items:center;gap:6px;color:var(--tx)"><input id="grman" type="checkbox"> Bắt buộc mọi người cập nhật</label></div>
  <label class="mu" style="display:block;margin-bottom:6px">Có gì mới (khách đọc khi cập nhật)</label><textarea id="grn" rows="6" style="width:100%" placeholder="- Thêm …&#10;- Sửa lỗi …"></textarea>
  <p><button onclick="R.g_relPublish()">🚀 Phát hành</button></p></div>
  <div class="box"><h3>🍎 Phát hành bản Mac (tự cập nhật)</h3>
  <p class="mu" style="margin-top:0">Bản Mac build sẵn trên GitHub (2 file .dmg: Apple Silicon + Intel). Chỉ cần nhập đúng số phiên bản — máy chủ tự dựng 2 link. Máy Mac của khách sẽ tự tải đúng loại chip và cập nhật.</p>
  <div class="mu" style="margin:-4px 0 10px">Đang phát: ${j.mac&&(j.mac.arm64||j.mac.x64)?`Apple Silicon <b>${j.mac.arm64?'v'+esc(j.mac.arm64):'—'}</b> · Intel <b>${j.mac.x64?'v'+esc(j.mac.x64):'—'}</b>`:'<span class="mu">chưa phát hành bản Mac nào</span>'}</div>
  <div class="row"><label>Số phiên bản<input id="gmv" placeholder="1.0.8" style="width:120px"></label>
  <label>Bắt buộc với bản thấp hơn (tùy chọn)<input id="gmmin" placeholder="vd. 1.0.0" style="width:170px"></label>
  <label style="flex-direction:row;align-items:center;gap:6px;color:var(--tx)"><input id="gmman" type="checkbox"> Bắt buộc mọi người cập nhật</label></div>
  <label class="mu" style="display:block;margin:4px 0 6px">Link gốc file .dmg (nâng cao — để nguyên nếu không chắc)</label>
  <input id="gmbase" class="mono" style="width:100%;box-sizing:border-box" value="${esc((j.mac&&j.mac.base)||'')}">
  <label class="mu" style="display:block;margin:10px 0 6px">Có gì mới (khách đọc khi cập nhật)</label><textarea id="gmn" rows="4" style="width:100%" placeholder="- Thêm …&#10;- Sửa lỗi …"></textarea>
  <p><button onclick="R.g_relPublishMac()">🍎 Phát hành bản Mac</button></p></div>
  <h3>Lịch sử phát hành</h3><table><tr><th>Phiên bản</th><th>Lúc</th><th>Dung lượng</th><th>Ghi chú</th><th>Trạng thái</th><th></th></tr>`+
  j.releases.map(r=>`<tr><td><b>v${esc(r.version)}</b>${+r.id==j.latest_id?' <span class="tag t-active">đang phát</span>':''}</td><td class="mu">${dt(+r.created_at)}</td><td class="mu">${mb(+r.size)}</td>
  <td style="white-space:pre-wrap;max-width:420px">${esc(r.notes||'')}</td><td>${+r.active?'<span class="tag t-paid">bật</span>':'<span class="tag t-revoked">đã ngừng</span>'}${r.sha256?'':' <span class="tag t-exp">không có SHA-256</span>'}</td>
  <td class="acts">${+r.active?`<button class="r" onclick="R.g_relToggle(${r.id},0)">Ngừng phát</button>`:`<button class="g" onclick="R.g_relToggle(${r.id},1)">Phát lại</button>`}<button class="g" onclick="copy('${esc(r.url)}')">Chép link</button></td></tr>`).join('')+'</table>';
  R.g_relPick()},
 g_relPick(){const o=$('#grf').selectedOptions[0];$('#grext').style.display=$('#grf').value?'none':'';if(o&&o.dataset.v&&!$('#grv').value)$('#grv').value=o.dataset.v},
 async g_relPublish(){const v=$('#grv').value.trim();if(!confirm('Phát hành GCloud Hub bản '+v+' cho tất cả khách?'))return;toast('Đang tính mã kiểm tra file…');
  const f=$('#grf').value,site=f==='@site';
  const j=await api('g_release_publish',{version:v,site,os:'win',file:site?'':f,url:$('#gru').value,sha256:$('#grs').value,min_version:$('#grmin').value,mandatory:$('#grman').checked,notes:$('#grn').value});
  if(j.ok){toast('Đã phát hành v'+j.version+'. Máy khách sẽ thấy trong vài phút.');go('g_releases')}},
 async g_relPublishMac(){const v=$('#gmv').value.trim();if(!confirm('Phát hành bản Mac '+v+' (Apple Silicon + Intel) cho tất cả khách?'))return;
  const j=await api('g_release_mac',{version:v,base:$('#gmbase').value.trim(),min_version:$('#gmmin').value,mandatory:$('#gmman').checked,notes:$('#gmn').value});
  if(j.ok){toast('Đã phát hành bản Mac v'+j.version+'.');go('g_releases')}},
 async g_relToggle(id,on){if(!on&&!confirm('Ngừng phát bản này? Khách sẽ nhận bản đang bật mới nhất còn lại.'))return;const j=await api('g_release_toggle',{id,active:on});if(j.ok){toast('Đã cập nhật');go('g_releases')}},
 async g_events(m){const j=await api('g_events');m.innerHTML=`<table><tr><th>Lúc</th><th>Việc</th><th>Chi tiết</th></tr>`+
  (j.events||[]).map(e=>`<tr><td class="mu">${dt(+e.at)}</td><td>${esc(e.kind)}</td><td style="word-break:break-all">${esc(e.detail||'')}</td></tr>`).join('')+'</table>'},
};
function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Đã chép')).catch(()=>{})}
async function paid(a,code){if(!confirm('Xác nhận đã nhận đủ tiền cho đơn '+code+' và tạo key?'))return;const j=await api(a,{code});if(j.ok){copy(j.key);toast('Đã tạo key (đã chép)');go(cur)}}
async function act(a,key){let body={key};
 if(a=='extend'){const n=prompt('Cộng thêm bao nhiêu ngày? (số âm để trừ)','30');if(n===null)return;body.days=n}
 if(a=='note'){const c=prompt('Tên khách / SĐT / Zalo:');if(c===null)return;body.customer=c;body.note=prompt('Ghi chú:')||''}
 if(a=='revoke'&&!confirm('Khóa key '+key+'? Phần mềm của khách sẽ về gói Miễn phí ở lần kiểm tra tới.'))return;
 if(a=='reset_machine'&&!confirm('Gỡ key khỏi máy hiện tại để khách kích hoạt trên máy mới?'))return;
 await api(a,body);toast('Đã cập nhật');R.keysLoad()}
if(T)api('info').then(j=>j.ok&&show(j)).catch(()=>{});
</script></body></html>
