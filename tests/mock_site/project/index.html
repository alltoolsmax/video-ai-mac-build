<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mock Flow project (test)</title>
<style>.cdk-overlay-pane{position:fixed;top:40px;left:40px;background:#222;color:#fff;padding:8px;z-index:9}
flow-tile-container{display:inline-block;width:300px;height:200px;margin:4px;position:relative}
.hover-overlay{display:none}flow-tile-container:hover .hover-overlay{display:block}</style></head>
<body>
<div id="grid"></div>
<form onsubmit="return false">
  <flow-ingredient-bar><div id="slots"></div></flow-ingredient-bar>
  <div class="ProseMirror" contenteditable="true" role="textbox" aria-label="Bạn muốn tạo những gì?" style="min-height:30px;border:1px solid #888"></div>
  <button type="button" aria-label="Thêm thành phần vào ô nhập câu lệnh" id="plus">add</button>
  <button type="button" class="settings-trigger-button" id="trig">settings</button><span id="trigsum"></span>
  <button type="button" class="switch" aria-label="Tác nhân Flow" id="agent" aria-pressed="false"><span class="handle">spark_off</span></button>
  <button type="submit" class="generate-icon-button" id="gen">arrow_forward</button>
</form>
<input type="file" id="fi" style="display:none" multiple>
<script>
const S = {kind:'image', vmode:'crop_free', ratio:'crop_16_9', model:'Nano Banana 2.1', res:'720p', dur:5, count:'x2', start:null, end:null, refs:[], assets:[], applied:[]};
window.S = S;
const ocont = () => { let c=document.querySelector('.cdk-overlay-container'); if(!c){ c=document.createElement('div'); c.className='cdk-overlay-container'; document.body.appendChild(c);} return c; };
const overlay = () => { let o = document.querySelector('.cdk-overlay-pane'); if (!o) { o = document.createElement('div'); o.className='cdk-overlay-pane'; ocont().appendChild(o);} return o; };
const closeAll = () => document.querySelectorAll('.cdk-overlay-pane, .cdk-overlay-backdrop').forEach(e=>e.remove());
document.addEventListener('keydown', e => { if (e.keyCode===27) closeAll(); });
function renderSlots(){ const s=document.getElementById('slots'); s.innerHTML='';
  if (S.kind==='videocam' && S.vmode==='crop_free') {
    for (const k of ['start','end']) { const b=document.createElement('button'); b.type='button';
      if (S[k]) { b.className='chip-container'; b.textContent='image cancel'; b.onclick=()=>{ S[k]=null; renderSlots(); }; } else { b.className='empty-chip'; b.textContent = k==='start'?'Bắt đầu':'Kết thúc'; b.onclick=()=>openPicker(k); }
      s.appendChild(b);} }
  else { S.refs.forEach((r,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='chip-container'; b.textContent='image cancel';
      b.onclick=()=>{ S.refs.splice(i,1); renderSlots(); }; s.appendChild(b); }); } }
function summary(){ const t=document.getElementById('trig'); t.textContent=(S.kind==='videocam'?'Video · '+S.res:'Nano') + ' ' + S.ratio + ' ' + S.count; }
setTimeout(summary,0);
function radio(key,label,group){ const b=document.createElement('button'); b.setAttribute('role','radio'); b.textContent=key+' '+label;
  b.setAttribute('aria-checked', String(S[group]===key)); b.onclick=()=>{S[group]=key; S.applied.push(group+'='+key); renderSettings(); renderSlots(); summary();}; return b; }
function renderSettings(){ if(!document.querySelector('.cdk-overlay-backdrop')){ const bd=document.createElement('div'); bd.className='cdk-overlay-backdrop'; bd.style.cssText='position:fixed;inset:0;z-index:8;background:transparent'; document.body.appendChild(bd);} const o=overlay(); o.innerHTML='';
  o.append(radio('image','Hình ảnh','kind'), radio('videocam','Video','kind'));
  if (S.kind==='videocam') o.append(radio('crop_free','Khung hình','vmode'), radio('chrome_extension','Thành phần','vmode'));
  for (const r of (S.kind==='image'?['crop_16_9','crop_landscape','crop_square','crop_portrait','crop_9_16']:['crop_16_9','crop_9_16'])) o.append(radio(r,r,'ratio'));
  const m=document.createElement('button'); m.className='mat-mdc-menu-trigger'; m.textContent='🍌 '+S.model+' arrow_drop_down';
  m.onclick=()=>{ const p=document.createElement('div'); p.className='cdk-overlay-pane';
    const list = S.kind==='image'?['Nano Banana Pro','Nano Banana 2 Lite','Nano Banana 2.1']:['Omni 1.2 Flash','Veo 3.1 - Lite','Veo 3.1 - Fast Sẽ ngừng hoạt động'];
    for (const n of list){ const it=document.createElement('div'); it.setAttribute('role','menuitem'); it.textContent='🍌 '+n; it.onclick=()=>{S.model=n.replace(/ Sẽ.*/,''); p.remove(); renderSettings();}; p.appendChild(it);} ocont().appendChild(p); };
  o.append(m);
  if (S.kind==='videocam') { o.append(radio('360p','360p','res'), radio('720p','720p','res'));
    const r=document.createElement('input'); r.type='range'; r.min=0; r.max=12; r.value=S.dur; const lab=document.createElement('span'); lab.textContent=(S.dur+3)+' giây';
    r.oninput=()=>{S.dur=+r.value; lab.textContent=(S.dur+3)+' giây';}; o.append(r, lab); }
  for (const c of ['x1','x2','x3','x4']) o.append(radio(c,c,'count'));
}
let trigMiss = 1;   // như Flow thật: lần bấm đầu đôi khi không mở bảng cài đặt
document.getElementById('trig').onclick = () => { if (trigMiss > 0) { trigMiss--; return; } if (document.querySelector('.cdk-overlay-pane')) closeAll(); else renderSettings(); };
document.getElementById('plus').onclick = () => openPicker('ref');
function openPicker(target){ closeAll(); const o=overlay();
  const up=document.createElement('button'); up.textContent='upload Tải nội dung nghe nhìn lên';
  up.onclick=()=>{ const fi=document.getElementById('fi'); fi.onchange=()=>{ const files=[...fi.files]; const go=()=>{ for (const f of files){ setTimeout(()=>{ S.assets.push(f.name); draw(); addUploadTile(f.name); }, 600);} };
      if (window.RIGHTS_OK) return go();
      const d=document.createElement('div'); d.setAttribute('role','dialog'); d.id='rights';
      d.style.cssText='position:fixed;left:30%;top:30%;background:#222;color:#fff;padding:20px;z-index:99999';
      d.innerHTML='<h3>Quyền sử dụng video này</h3><p>Hãy đảm bảo rằng bạn có các quyền cần thiết…</p>';
      for (const [t,keep] of [['Huỷ',null],['Tôi đồng ý, không hiện lại',true],['Tôi đồng ý',false]]) {
        const b=document.createElement('button'); b.textContent=t; b.onclick=()=>{ d.remove(); window.RIGHTS_CLICKS=(window.RIGHTS_CLICKS||[]).concat([t]); if (keep!==null){ if(keep) window.RIGHTS_OK=true; go(); } }; d.append(b); }
      document.body.append(d); }; fi.click(); };
  o.appendChild(up); const list=document.createElement('div'); o.appendChild(list);
  let sel=null;
  const add=document.createElement('button'); add.className='detail-add-to-prompt-btn'; add.textContent='Thêm vào câu lệnh';
  add.onclick=()=>{ if(!sel) return; if (target==='ref') S.refs.push(sel); else S[target]=sel; closeAll(); renderSlots(); };
  o.appendChild(add);
  setTimeout(()=>{ const r=add.getBoundingClientRect(); const tip=document.createElement('div'); tip.className='mat-mdc-tooltip';
    tip.style.cssText=`position:fixed;left:${r.left-4}px;top:${r.top-4}px;width:${r.width+8}px;height:${r.height+8}px;z-index:20;background:rgba(0,0,0,.01)`;
    o.appendChild(tip); }, 50);
  function draw(){ list.innerHTML=''; for (const a of S.assets){ const b=document.createElement('button'); b.className='asset-item'; b.setAttribute('role','option'); b.textContent='image '+a; b.onclick=()=>{sel=a;}; list.appendChild(b);} }
  draw();
}
let n=0;
(function(){ const a=document.getElementById('agent');
  const set=on=>{ a.setAttribute('aria-pressed', String(on)); a.querySelector('.handle').textContent = on ? 'spark' : 'spark_off'; };
  set(/agent=1/.test(location.search)); a.onclick=()=>set(a.getAttribute('aria-pressed')!=='true'); })();
const _agentGen = () => { const box=document.createElement('div'); box.id='agentAsk';
  box.innerHTML='<p>Bạn có muốn tôi bắt đầu tạo 1 video này với chi phí là 24 tín dụng không?</p><button>Phê duyệt</button><button>Luôn phê duyệt trong dự án</button><button>Từ chối</button>';
  document.body.append(box); };
document.getElementById('gen').addEventListener('click', e => { if (document.getElementById('agent').getAttribute('aria-pressed')==='true') { e.stopImmediatePropagation(); _agentGen(); } }, true);
document.getElementById('gen').onclick = () => {
  const p=document.querySelector('.ProseMirror').innerText.trim(); window.lastPrompt=p; document.querySelector('.ProseMirror').innerText='';
  const cnt=+S.count.slice(1); const grid=document.getElementById('grid');
  for (let i=0;i<cnt;i++){ const t=document.createElement('flow-tile-container'); const pend=document.createElement('flow-pending-tile'); pend.textContent='image 5% '+p; t.appendChild(pend); grid.prepend(t);
    if (p.includes('BLOCKME')) { setTimeout(()=>{ t.innerHTML='<div>Không thể tạo vì vi phạm chính sách</div>'; }, 1200); continue; }
    let pct=5; const iv=setInterval(()=>{ pct+=30; pend.textContent='image '+pct+'% '+p; if (pct>=95){ clearInterval(iv); finish(t, p);} }, 400); }
};
const TILES={};
function mkCanvas(w,h,color,label){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.fillStyle=color; g.fillRect(0,0,w,h); g.fillStyle='#fff'; g.font='60px sans-serif'; g.fillText(label,20,h/2); return c; }
function addUploadTile(name){   // như Flow thật: ảnh tải lên cũng thành 1 ô trong dự án
  mkCanvas(256,256,'#888',name).toBlob(b=>{ const url=URL.createObjectURL(b); n++; const k='k'+n; TILES[k]={isVid:false,url};
    const t=document.createElement('flow-tile-container'); t.setAttribute('data-k',k);
    t.innerHTML=`<flow-image-tile><img class="image" style="width:120px" src="${url}"><span>image ${name}</span></flow-image-tile><div class="hover-overlay"><button>more_vert</button></div>`;
    document.getElementById('grid').prepend(t); });
}
function finish(t, p){ n++; const k='k'+n; t.innerHTML=''; t.setAttribute('data-k',k);
  const isVid = S.kind==='videocam';
  const DIM={crop_16_9:[1376,768],crop_landscape:[1200,896],crop_square:[1024,1024],crop_portrait:[896,1200],crop_9_16:[768,1376]}; const [cw,ch]=DIM[S.ratio]||[1376,768];
  const c=mkCanvas(cw,ch,`hsl(${n*70},60%,50%)`,p.slice(0,30)+' | '+S.model+' '+S.ratio);
  c.toBlob(b=>{ const url=URL.createObjectURL(b); const vurl='clip.mp4#'+n; TILES[k]={isVid,url,vurl};
    const tile=document.createElement(isVid?'flow-video-tile':'flow-image-tile');
    tile.innerHTML = (isVid?`<video src="${vurl}" muted style="width:300px"></video>`:`<img class="image" style="width:300px" src="${url}">`) +
      `<span>${p.slice(0,40)}</span><button aria-label="Sử dụng lại câu lệnh">redo</button>`;
    const hov=document.createElement('div'); hov.className='hover-overlay'; hov.innerHTML='<button aria-label="Tuỳ chọn khác">more_vert</button>';
    t.appendChild(tile); t.appendChild(hov); }, 'image/png');
}
// menu ⋮ dùng ủy quyền sự kiện (ô có thể bị vẽ lại bất cứ lúc nào)
document.addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn || !btn.textContent.includes('more_vert')) return;
  const k = btn.closest('flow-tile-container').getAttribute('data-k'); const T = TILES[k]; if (!T) return;
  const m=document.createElement('div'); m.className='cdk-overlay-pane';
  const dl=document.createElement('div'); dl.setAttribute('role','menuitem'); dl.textContent='download Tải xuống';
  dl.onclick=()=>{ const s=document.createElement('div'); s.className='cdk-overlay-pane'; s.style.left='40px'; s.style.top='40px'; s.style.zIndex='11'; s.style.minWidth='300px';
    const items = T.isVid ? ['270p Ảnh GIF động','720p Kích thước gốc','1080p Đã tăng độ phân giải'] : ['1K Kích thước gốc','2K Đã tăng độ phân giải'];
    items.forEach(txt=>{ const it=document.createElement('div'); it.setAttribute('role','menuitem'); it.textContent=txt;
      it.onclick=()=>{ window.lastDownload=txt; (window.downloads=window.downloads||[]).push(txt); const a=document.createElement('a'); a.href= T.isVid ? 'clip.mp4' : T.url; a.download = T.isVid ? 'flow_video.mp4' : 'flow_image.png'; document.body.appendChild(a); a.click(); a.remove(); };
      s.appendChild(it); });
    ocont().appendChild(s); };
  m.style.zIndex='12'; m.style.minWidth='320px'; m.style.minHeight='200px'; m.appendChild(dl); ocont().appendChild(m);
});
// như Flow thật: lưới được vẽ lại → mọi thuộc tính do công cụ ngoài gắn vào đều mất
setInterval(() => {
  for (const t of [...document.querySelectorAll('#grid > flow-tile-container')]) {
    if (t.querySelector('flow-pending-tile')) continue;
    const c = t.cloneNode(true);
    [...c.attributes].filter(a => a.name.startsWith('data-va')).forEach(a => c.removeAttribute(a.name));
    t.replaceWith(c);
  }
}, 1300);
renderSlots();
</script>
<div id="editor" style="display:none">
  <button aria-label="Nút quay lại để quay về trang trước" id="eback">arrow_back</button>
  <button aria-label="Tải nội dung nghe nhìn xuống" id="edl">download</button>
  <div id="clips"><div class="clip is-first is-last">clip</div></div>
  <button aria-label="Thêm đoạn video" id="eadd">add</button>
  <button aria-label="Điều kiện kích hoạt cài đặt" id="esecs" style="display:none">4 giây</button>
  <button aria-label="Thoát khỏi chế độ mở rộng" id="eexit" style="display:none">Kéo dài close</button>
  <div class="ProseMirror" contenteditable="true" role="textbox" style="min-height:30px;border:1px solid #888"></div>
  <button aria-label="Bắt đầu tạo" id="ego">arrow_forward</button>
</div>
<script>
// ===== trình chỉnh sửa video + Kéo dài (giống Flow 11/2026)
const E = {secs: 4, extending: false, done: []};
window.E = E;
const ed = document.getElementById('editor');
document.addEventListener('click', e => {        // bấm vào video trong lưới → mở trình chỉnh sửa
  const v = e.target.closest('#grid flow-video-tile video'); if (!v) return;
  location.hash = '#/edit/' + v.closest('flow-tile-container').getAttribute('data-k');
  document.querySelector('form').style.display = 'none'; ed.style.display = 'block';
});
document.getElementById('eback').onclick = () => { location.hash = ''; ed.style.display = 'none'; document.querySelector('form').style.display = ''; };
document.getElementById('eadd').onclick = () => { closeAll(); const o = overlay();
  for (const t of ['add Thêm đoạn video', 'keyboard_double_arrow_right Kéo dài']) { const b = document.createElement('button');
    b.className = 'mat-mdc-menu-item'; b.setAttribute('role', 'menuitem'); b.textContent = t;
    b.onclick = () => { closeAll(); if (t.includes('Kéo dài')) { E.extending = true;
      document.getElementById('clips').innerHTML = '<div class="clip is-first">clip</div><div class="clip extend-composing">Kéo dài</div>';
      document.getElementById('esecs').style.display = ''; document.getElementById('eexit').style.display = ''; } };
    o.appendChild(b); } };
document.getElementById('eexit').onclick = () => { E.extending = false; document.getElementById('clips').innerHTML = '<div class="clip is-first is-last">clip</div>'; document.getElementById('esecs').style.display = 'none'; document.getElementById('eexit').style.display = 'none'; };
document.getElementById('esecs').onclick = () => { closeAll();
  const bd = document.createElement('div'); bd.className = 'cdk-overlay-backdrop'; bd.style.cssText = 'position:fixed;inset:0;z-index:8';
  bd.onclick = () => closeAll(); document.body.appendChild(bd);
  const o = overlay(); const r = document.createElement('input'); r.type = 'range'; r.min = 3; r.max = 10; r.step = 1; r.value = E.secs;
  r.setAttribute('aria-label', 'Kéo dài thời lượng');
  r.oninput = () => { E.secs = +r.value; document.getElementById('esecs').textContent = E.secs + ' giây'; };
  o.appendChild(r); };
document.getElementById('ego').onclick = () => {
  if (!E.extending) return;
  const box = ed.querySelector('.ProseMirror'); const p = box.innerText.trim(); box.innerText = '';
  const clips = document.getElementById('clips');
  clips.innerHTML = '<div class="clip is-extend-generating is-first is-last">Đang kéo dài…</div>';
  E.extending = false; document.getElementById('esecs').style.display = 'none'; document.getElementById('eexit').style.display = 'none';
  setTimeout(() => {
    if (p.includes('BLOCKEXT')) { clips.innerHTML = '<div class="clip is-extend-failed is-first is-last">Không thể kéo dài vì vi phạm chính sách</div>'; return; }
    E.done.push({prompt: p, secs: E.secs}); clips.innerHTML = '<div class="clip is-first is-last">refresh Kéo dài lại add</div>';
  }, 2500);
};
document.getElementById('edl').onclick = () => { closeAll(); const o = overlay();
  for (const t of ['270p Ảnh GIF động', '720p Kích thước gốc']) { const it = document.createElement('div'); it.setAttribute('role', 'menuitem'); it.textContent = t;
    it.onclick = () => { (window.extDownloads = window.extDownloads || []).push(t); const a = document.createElement('a'); a.href = 'clip.mp4'; a.download = 'extended.mp4';
      document.body.appendChild(a); a.click(); a.remove(); closeAll(); };
    o.appendChild(it); } };
</script></body></html>
