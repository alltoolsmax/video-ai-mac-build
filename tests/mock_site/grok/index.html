<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mock Grok chat (test)</title></head>
<body><main>
<div id="cookie"><span>Cookie notice</span><button onclick="this.parentNode.remove()">Reject All</button></div>
<div id="tools"><img id="sample" src="" style="width:200px"><span>Photo edit</span></div>
<div id="conv"></div>
<form onsubmit="return false"><input type="file" id="fi" style="display:none" multiple>
<div contenteditable="true" aria-label="Message Grok" id="box" style="min-height:30px;border:1px solid #888"></div>
<button type="button" aria-label="Send" id="send">↑</button></form>
</main>
<script>
const mk = (w, h, color, text) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = '60px sans-serif'; g.fillText(text, 30, h / 2); return c; };
mk(768, 432, '#555', 'sample').toBlob(b => { document.getElementById('sample').src = URL.createObjectURL(b); });   // ảnh mẫu của trang: KHÔNG được lấy
window.sent = []; window.files = 0;
document.getElementById('fi').onchange = e => { window.files = e.target.files.length; };
document.getElementById('send').onclick = () => {
  const box = document.getElementById('box'); const p = box.innerText.trim(); box.innerText = ''; window.sent.push(p);
  history.pushState({}, '', location.pathname + '?c=' + Date.now());
  const conv = document.getElementById('conv');
  const u = document.createElement('div'); u.className = 'msg user'; u.innerHTML = '<div><span>' + p.replace(/</g, '&lt;') + '</span></div>'; conv.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg bot'; a.textContent = 'Thinking…'; conv.appendChild(a);
  const actions = '<button aria-label="Download"></button><button aria-label="Copy response"></button>';
  if (p.includes('BLOCKME')) { setTimeout(() => { a.innerHTML = "<p>I can't generate that because it violates the content policy.</p>" + actions; }, 1200); return; }
  const m = p.match(/Aspect ratio (\d+):(\d+)/); const rw = m ? +m[1] : 1, rh = m ? +m[2] : 1;
  if (/^(Generate a video|Animate)/.test(p)) {
    setTimeout(() => { a.innerHTML = '<p>Here is your video.</p><video muted src="../clip.mp4" style="width:240px;height:135px"></video>' + actions; }, 3000);
    return;
  }
  const n = +((p.match(/^Generate (\d) images/) || [0, 1])[1]);
  a.innerHTML = '<p>Generating 40%</p>';
  setTimeout(() => {
    a.innerHTML = '<p>Here you go.</p>';
    let pending = n;
    for (let k = 0; k < n; k++) {
      const w = 1280, h = Math.round(1280 * rh / rw);
      mk(w, h, `hsl(${k * 70},50%,40%)`, 'R' + k).toBlob(b => { const im = document.createElement('img'); im.src = URL.createObjectURL(b); im.style.width = '220px';
        a.appendChild(im); if (--pending === 0) a.insertAdjacentHTML('beforeend', actions); }, 'image/jpeg', 0.9);
    }
  }, 2500);
};
</script></body></html>
