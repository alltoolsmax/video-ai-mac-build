<!doctype html><html><head><meta charset="utf-8"><title>Mock chat</title>
<style>body{font-family:sans-serif;background:#111;color:#eee} .msg{margin:8px;padding:8px;border:1px solid #444;white-space:pre-wrap}</style></head>
<body><main>
<div id="conv"></div>
<form id="f" onsubmit="return false"><textarea id="prompt-textarea" placeholder="Message" rows="4" cols="80"></textarea>
<input type="file" id="att" accept="image/*" multiple style="display:none">
<button type="button" data-testid="send-button" id="send">Send</button>
<button type="button" data-testid="stop-button" id="stop" style="display:none">Stop</button></form>
</main>
<div id="cf" style="display:none"><p>Verify you are human</p><button id="human">Tôi là người</button></div>
<script>
if (/verify=1/.test(location.search) && !sessionStorage.getItem('human')) {
  document.querySelector('main').style.display = 'none'; document.getElementById('cf').style.display = 'block';
  document.getElementById('human').onclick = () => { sessionStorage.setItem('human', '1');
    document.getElementById('cf').remove(); document.querySelector('main').style.display = ''; };
}
const conv = document.getElementById('conv'), ta = document.getElementById('prompt-textarea');
window.ATTACH=[]; window.SENT=[]; let lastScript = '';
document.getElementById('att').onchange = e => { window.ATTACH = [...e.target.files].map(f => f.name); };
function scriptReply(text) {
  const n = +(text.match(/(?:SỐ CẢNH|SỐ PROMPT CẦN VIẾT): (\d+)/) || [0, 1])[1];
  const tags = [...text.matchAll(/Ảnh \d+ = ([A-Z]{2}\d+)/g)].map(m => m[1]);
  const bad = /BADJSON/.test(text) && !/BỊ LỖI|chưa đúng yêu cầu/.test(text);
  const scenes = [];
  const k = /Chỉ viết lại CẢNH/.test(text) ? 1 : n;
  for (let i = 1; i <= k; i++) scenes.push({time: '', title: 'Cảnh thử ' + i, refs: tags.slice(0, 2),
      frame: 'Khung đầu cảnh ' + i, prompt: 'Scene ' + i + ' with ' + tags.join('+') + ' files=' + window.ATTACH.join(',')});
  const js = bad ? '{"scenes": [' : JSON.stringify({profiles: Object.fromEntries(tags.map(t => [t, 'hồ sơ ' + t])), scenes});
  if (/NOEND/.test(text)) return 'OK\n[[OUT]]\n' + js;          // AI quên mốc [[END]]
  return 'OK\n[[OUT]]\n' + js + '\n[[END]]';
}
function reply(text) {
  if (/chưa đúng yêu cầu/.test(text) && lastScript) {
    if (/REFUSEALL/.test(lastScript)) return 'Tôi là một mô hình ngôn ngữ nên điều đó nằm ngoài mục đích mà tôi được tạo ra.';
    return scriptReply(lastScript + '\nchưa đúng yêu cầu');
  }
  if (/ĐỊNH DẠNG TRẢ VỀ BẮT BUỘC/.test(text)) {
    lastScript = text;
    if (/REFUSEALL/.test(text)) return 'Tôi là một mô hình ngôn ngữ nên điều đó nằm ngoài mục đích mà tôi được tạo ra.';
    if (/NOJSON/.test(text)) return 'Bạn muốn video theo phong cách nào? Mình có thể đề xuất vài hướng.';
    return scriptReply(text);
  }
  const m = text.match(/Trả về đúng (\d+) dòng/);
  let lines = [];
  if (m) {
    const ps = text.split('\n').filter(l => /^\d+\.\s/.test(l)).map(l => l.replace(/^\d+\.\s*/, ''));
    lines = ps.map(p => 'Improved: ' + p);
  } else {
    const n = +(text.match(/viết (\d+) prompt/) || [0, 1])[1];
    for (let i = 1; i <= n; i++) lines.push((i) + '. Scene ' + i + ' of the story');
  }
  return 'Sure, here you go.\n[[OUT]]\n' + lines.join('\n') + '\n[[END]]';
}
document.getElementById('send').onclick = () => {
  const t = ta.value; if (!t.trim()) return;
  const u = document.createElement('div'); u.className = 'msg'; u.textContent = t; conv.appendChild(u); ta.value = '';
  const a = document.createElement('div'); a.className = 'msg'; conv.appendChild(a);
  window.SENT.push(t);
  const full = reply(t); let k = 0; const stop = document.getElementById('stop');
  // THINKFIRST: hiện "Đang suy nghĩ…" 14 giây KHÔNG có nút dừng (như trang thật đổi giao diện) rồi mới viết
  const think = /THINKFIRST/.test(t) && !/chưa đúng yêu cầu/.test(t);
  if (think) a.textContent = 'Đang suy nghĩ…'; else stop.style.display = '';
  setTimeout(function tick() {
    stop.style.display = '';
    k = Math.min(full.length, k + 40); a.textContent = full.slice(0, k);
    if (k < full.length) { setTimeout(tick, 60); return; }
    stop.style.display = 'none';
    if (/HIDDENCODE/.test(t) && !/chưa đúng yêu cầu/.test(t)) {     // như Gemini chạy ẩn: khối code không có trong chữ hiển thị
      const m = full.match(/\[\[OUT\]\]\n([\s\S]*)\n\[\[END\]\]/);
      a.textContent = ''; a.append('OK\n[[OUT]]\n');
      const pre = document.createElement('pre'); pre.style.display = 'none'; pre.textContent = m ? m[1] : '';
      a.append(pre); a.append('\n[[END]]');
    }
  }, think ? 14000 : 700);
};
</script></body></html>
