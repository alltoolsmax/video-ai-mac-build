name = "mrhuynh-license"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "mrhuynh-license"
database_id = "DIEN_ID_SAU_KHI_TAO"   # setup.bat tự điền

[vars]
DEFAULT_PRODUCT = "videoai"
KEY_PREFIX = "VAI"
TRIAL_DAYS = "10"
TRANSFER_COOLDOWN_DAYS = "30"
RECHECK_HOURS = "24"
OFFLINE_GRACE_DAYS = "3"
CONTACT_NAME = "Mr. Huỳnh"
CONTACT_ZALO = "https://zalo.me/0979006367"
CONTACT_PHONE = "0979006367"
# Thanh toán tự động (để trống = khách liên hệ Zalo, bạn tạo key tay):
BANK_ID = ""          # mã ngân hàng VietQR, vd: MB, VCB, TCB, ACB
BANK_ACCOUNT = ""     # số tài khoản
BANK_NAME = ""        # tên chủ tài khoản (không dấu)
# Bí mật (đặt bằng lệnh wrangler secret put, KHÔNG ghi vào đây):
#   SIGNING_KEY    khóa ký giấy phép (setup.bat tự tạo)
#   ADMIN_TOKEN    mật khẩu trang quản trị
#   SEPAY_API_KEY  khóa webhook SePay (nếu bật thanh toán tự động)
