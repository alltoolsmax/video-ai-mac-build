# Build Video AI - Mr Huynh cho macOS trên máy Mac của GitHub: 2 bộ cài
#   - arm64 : máy Mac chip Apple M (M1–M4) chạy thẳng
#   - intel : máy Mac Intel (chip M cũng chạy được qua Rosetta)
# Chạy khi đẩy code lên nhánh main, hoặc tab Actions > "Build macOS" > Run workflow.
# Tải kết quả: tab Releases của kho (mỗi phiên bản 1 bản phát hành, gồm bộ cài 2 loại chip + gói trang tải).
name: Build Windows + macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Kiểm tra mở tools thật (chặn phát hành bản tắt ngay khi mở)
        env:
          VIDEOAI_SMOKE: "2500"
        run: |
          python -m pip install -q --prefer-binary -r requirements.txt pytest
          python -m pytest -q tests/test_startup.py

      - name: Build (.app + .dmg + gói trang tải)
        env:
          CI: "1"
        run: bash "build Mac.command" < /dev/null

      - name: Đặt tên theo chip
        id: names
        run: |
          VER=$(python -c 'from videoai.core.paths import APP_VERSION; print(APP_VERSION)')
          mkdir -p out
          mv "dist/VideoAI-MrHuynh-$VER-mac.dmg" "out/VideoAI-MrHuynh-$VER-mac-${{ matrix.arch }}.dmg"
          cat dist/downloads-mac/mac.json
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Kiểm tra ứng dụng mở được
        run: |
          APPBIN="dist/Video AI - Mr Huynh.app/Contents/MacOS"
          file "$APPBIN"/* | head -5
          codesign --verify --deep "dist/Video AI - Mr Huynh.app"
          grep -q '"public_key": "[A-Za-z0-9_-]\{40,\}"' videoai/license_config.json

      - name: Đưa lên Releases (bản nháp – chỉ công bố khi đủ 2 chip + zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.names.outputs.ver }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Video AI - Mr Huynh $TAG (macOS)" \
              --notes "Bản macOS. Khách cài lần đầu: video_ai_mrhuynh_mac.zip (bên trong 2 bộ cài: chip Apple M + Intel). Phần mềm Mac tự cập nhật từ đây." \
              --target "${{ github.sha }}" || sleep 10
          gh release upload "$TAG" out/* --clobber

  win:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Kiểm tra mở tools thật (chặn phát hành bản tắt ngay khi mở)
        env:
          VIDEOAI_SMOKE: "2500"
        run: |
          python -m pip install -q --prefer-binary -r requirements.txt pytest pyinstaller
          python -m pytest -q tests/test_startup.py
      - name: Thông tin bản quyền (khóa công khai lấy từ máy chủ – thiếu thì KHÔNG phát hành)
        shell: bash
        run: |
          python tools/fill_license_config.py
          grep -q '"public_key": "[A-Za-z0-9_-]\{40,\}"' videoai/license_config.json
      - name: Build .exe + bộ cài Setup
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/out "build/VideoAI.spec"
          if (-not (Test-Path "dist/VideoAI-MrHuynh/VideoAI-MrHuynh.exe")) { throw "PyInstaller khong tao duoc exe" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "build/fetch_tools.ps1" -Dest "dist/VideoAI-MrHuynh/bin"
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD/dist/VideoAI-MrHuynh/ms-playwright"
          python -m playwright install chromium
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = python -c "from videoai.core.paths import APP_VERSION;print(APP_VERSION)"
          & $iscc /Q "/DAppVersion=$ver" "build/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup loi" }
          python tools/make_downloads.py "dist/VideoAI-MrHuynh-Setup-$ver.exe"
          Get-Content dist/downloads/video_win.json
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Đưa lên Releases (bản nháp)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VER"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Video AI - Mr Huynh $TAG" \
              --notes "Windows: video_ai_mrhuynh_win.zip (khách cài lần đầu). macOS: video_ai_mrhuynh_mac.zip (2 bộ cài chip Apple M + Intel)." \
              --target "${{ github.sha }}" || sleep 10
          gh release upload "$TAG" dist/downloads/video_ai_mrhuynh_win.exe dist/downloads/video_ai_mrhuynh_win.zip dist/downloads/video_win.json --clobber

  # Tệp TÊN CỐ ĐỊNH cho link không đổi: …/releases/latest/download/video_ai_mrhuynh_mac.zip
  # + 2 bộ cài theo chip cho tự cập nhật + video_mac.json (máy chủ đọc). Xong mới công bố (latest).
  package:
    needs: [build, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo tệp tên cố định và công bố bản mới
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c 'from videoai.core.paths import APP_VERSION; print(APP_VERSION)')
          TAG="v$VER"
          mkdir -p in
          gh release download "$TAG" -D in -p "*-mac-arm64.dmg" -p "*-mac-intel.dmg" --clobber
          python3 tools/make_downloads.py --mac "apple=in/VideoAI-MrHuynh-$VER-mac-arm64.dmg" "intel=in/VideoAI-MrHuynh-$VER-mac-intel.dmg"
          cat dist/downloads-mac/video_mac.json
          gh release upload "$TAG" dist/downloads-mac/* --clobber
          gh release edit "$TAG" --draft=false --latest
