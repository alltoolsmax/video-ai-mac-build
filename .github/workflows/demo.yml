# Build bản DEMO cho Windows (để chạy thử trước khi phát hành thật).
# Chạy khi đẩy lên nhánh "demo" hoặc bấm Run workflow. KHÔNG đụng tới bản latest / tự cập nhật của khách:
# chỉ tạo một bản "ext-demo" đánh dấu prerelease, link cố định để tải về thử.
name: Build DEMO (Windows)

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win-demo:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cài gói + kiểm tra mở tools thật
        env:
          VIDEOAI_SMOKE: "2500"
        run: |
          python -m pip install -q --prefer-binary -r requirements.txt pytest pyinstaller
          python -m pytest -q tests/test_startup.py tests/test_ext_bridge.py
      - name: Thông tin bản quyền (khóa công khai)
        shell: bash
        run: |
          python tools/fill_license_config.py
          grep -q '"public_key": "[A-Za-z0-9_-]\{40,\}"' videoai/license_config.json
      - name: Build .exe + bộ cài Setup + gói tiện ích Chrome
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/out "build/VideoAI.spec"
          if (-not (Test-Path "dist/VideoAI-MrHuynh/VideoAI-MrHuynh.exe")) { throw "PyInstaller khong tao duoc exe" }
          powershell -NoProfile -ExecutionPolicy Bypass -File "build/fetch_tools.ps1" -Dest "dist/VideoAI-MrHuynh/bin"
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD/dist/VideoAI-MrHuynh/ms-playwright"
          python -m playwright install chromium
          Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = python -c "from videoai.core.paths import APP_VERSION;print(APP_VERSION)"
          & $iscc /Q "/DAppVersion=$ver" "build/installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup loi" }
          Copy-Item "dist/VideoAI-MrHuynh-Setup-$ver.exe" "dist/VideoAI-MrHuynh-Setup-DEMO.exe"
          python tools/make_extension.py dist
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Đưa lên bản DEMO (prerelease, KHÔNG phải latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ext-demo"
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release edit "$TAG" --prerelease --latest=false --title "DEMO v$VER (Chrome Extension) — chạy thử" \
            || gh release create "$TAG" --prerelease --latest=false --title "DEMO v$VER (Chrome Extension) — chạy thử" \
                 --notes "Bản chạy thử, KHÔNG phải bản phát hành. Gồm bộ cài Windows và gói Tiện ích Chrome." \
                 --target "${{ github.sha }}"
          gh release upload "$TAG" \
            "dist/VideoAI-MrHuynh-Setup-DEMO.exe" \
            "dist/video-ai-tro-ly-chrome.zip" --clobber
